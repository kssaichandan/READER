<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Minimal Reader</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
</head>
<body>
  <main class="wrap">
    <header class="header">
      <div class="brand"><div class="logo">R</div><div><div class="title">Minimal Reader</div><div class="small">Clean local-first reader</div></div></div>
      <div class="controls"><button id="demoBtn" class="btn">Demo</button><button id="chooseBtn" class="btn ghost">Choose file</button></div>
    </header>

    <section id="landing">
      <div class="grid">
        <div>
          <div id="dropZone" class="drop">
            <p class="small">Drop files here or click <strong>Choose file</strong></p>
            <input id="fileInput" type="file" accept=".txt,.html,.htm,.pdf,.epub" hidden multiple>
          </div>
          <div style="margin-top:16px" id="libraryList" class="library"></div>
        </div>
        <aside>
          <div class="card">
            <div><strong>Quick tips</strong><div class="small">Supports TXT/HTML (plain render). PDF/EPUB need external parsing.</div></div>
          </div>
          <div style="height:12px"></div>
          <div class="card small">Deployable to static hosts (Render, Netlify)</div>
        </aside>
      </div>
    </section>

    <section id="readerView" class="reader hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div id="bookTitle">No book</div><div><button id="backBtn" class="btn ghost">Back</button></div></div>
      <div id="readerContent"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
